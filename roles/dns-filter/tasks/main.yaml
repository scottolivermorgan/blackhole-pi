- name: Disable legacy lighttpd service when present
  systemd:
    name: lighttpd
    enabled: false
    state: stopped
  failed_when: false


- name: Create pihole group
  group:
    name: pihole
    state: present
  tags:
    - pihole
- name: Create pihole user
  user:
    name: pihole
    group: pihole
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  tags:
    - pihole
- name: Create /etc/pihole directory
  file:
    path: /etc/pihole
    state: directory
    owner: pihole
    group: pihole
    mode: '0755'
  tags:
    - pihole
- name: Create /etc/dnsmasq.d directory
  file:
    path: /etc/dnsmasq.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure sqlite3 is installed for Pi-hole list management
  apt:
    name: sqlite3
    state: present
    update_cache: true
- name: Check if /etc/pihole/setupVars.conf already exists
  stat:
    path: /etc/pihole/setupVars.conf
  register: setupvars
- name: Generate pihole setupVars.conf (overwrite with -e overwrite_setupvars=true )
  copy:
    dest: /etc/pihole/setupVars.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    content: |
      WEBPASSWORD={{ WEBPASSWORD | hash('sha256') | hash('sha256') }}
      PIHOLE_INTERFACE={{ PIHOLE_INTERFACE | default(ansible_default_ipv4.interface) }}
      IPV4_ADDRESS={{ IPV4_ADDRESS | default(ansible_default_ipv4.address ~ '/' ~ ansible_default_ipv4.prefix) }}
      IPV6_ADDRESS={{ IPV6_ADDRESS | default('') }}
      QUERY_LOGGING={{ QUERY_LOGGING | default(true) | lower }}
      INSTALL_WEB_INTERFACE={{ INSTALL_WEB | default(true) | lower }}
      LIGHTTPD_ENABLED=true
      INSTALL_WEB_SERVER=true
      DNSMASQ_LISTENING={{ DNSMASQ_LISTENING | default('single') }}
      PIHOLE_DNS_1={{ PIHOLE_DNS_1 | default('8.8.8.8') }}
      PIHOLE_DNS_2={{ PIHOLE_DNS_2 | default('8.8.4.4') }}
      PIHOLE_DNS_3={{ PIHOLE_DNS_3 | default('2001:4860:4860:0:0:0:0:8888') }}
      PIHOLE_DNS_4={{ PIHOLE_DNS_4 | default('2001:4860:4860:0:0:0:0:8844') }}
      DNS_FQDN_REQUIRED={{ DNS_FQDN_REQUIRED | default(true) | lower }}
      DNS_BOGUS_PRIV={{ DNS_BOGUS_PRIV | default(true) | lower }}
      DNSSEC={{ DNSSEC | default(false) | lower }}
      TEMPERATUREUNIT={{ TEMPERATUREUNIT | default('C') }}
      WEBUIBOXEDLAYOUT={{ WEBUIBOXEDLAYOUT | default('traditional') }}
      API_EXCLUDE_DOMAINS=
      API_EXCLUDE_CLIENTS=
      API_QUERY_LOG_SHOW=all
      API_PRIVACY_MODE=false
      BLOCKING_ENABLED=true
      REV_SERVER={{ REV_SERVER | default(true) | lower }}
      REV_SERVER_CIDR={{ REV_SERVER_CIDR | default('192.168.2.0/24') }}
      REV_SERVER_TARGET={{ REV_SERVER_TARGET | default(gateway) }}
      REV_SERVER_DOMAIN=
      CACHE_SIZE={{ CACHE_SIZE | default(10000) }}
  when: (setupvars.stat.exists == false ) or (( overwrite_setupvars is defined ) and ( overwrite_setupvars == "true" ))
  register: copy_setupvars

#  - name: Generate adlist file for unattended installation
