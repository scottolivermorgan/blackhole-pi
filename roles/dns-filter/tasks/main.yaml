- name: Check if pihole already installed
  stat:
    path: /usr/local/bin/pihole
  register: pihole_installed


# Executing the setup when it's already installed, does not break the setup, but just eats a lot of time and does the same as pihole -r
- name: Install pihole in unattended mode. This might take some time!
  shell: 'curl -L https://install.pi-hole.net | bash /dev/stdin --unattended'
  when:  ( pihole_installed.stat.exists == false ) or
         ( copy_setupvars.changed )

- name: Ensure Pi-hole FTL webserver listens on HTTP
  command: pihole-FTL --config webserver.port "{{ pihole_webserver_port }}"

- name: Ensure Pi-hole DNS interface is configured
  command: pihole-FTL --config dns.interface "{{ pihole_dns_interface | default(PIHOLE_INTERFACE | default(ansible_default_ipv4.interface), true) }}"

- name: Ensure Pi-hole DNS listening mode is configured
  command: pihole-FTL --config dns.listeningMode "{{ pihole_dns_listening_mode }}"

- name: Ensure Pi-hole admin password is set
  command: pihole setpassword "{{ WEBPASSWORD }}"
  when:
    - WEBPASSWORD is defined
    - WEBPASSWORD | length > 0

- name: Render managed Pi-hole adlist SQL
  template:
    src: pihole-adlists.sql.j2
    dest: /etc/pihole/adlists.sql
    owner: root
    group: root
    mode: '0600'
  when: pihole_adlists | length > 0
  register: pihole_adlists_sql

- name: Apply managed Pi-hole adlists
  command:
    argv:
      - sqlite3
      - /etc/pihole/gravity.db
      - ".read /etc/pihole/adlists.sql"
  when: pihole_adlists | length > 0
  register: pihole_adlists_apply
  changed_when: pihole_adlists_sql.changed

- name: Rebuild Pi-hole gravity after adlist changes
  command: pihole updateGravity
  when:
    - pihole_adlists | length > 0
    - pihole_adlists_apply.changed

- name: Render Pi-hole dns.hosts payload
  template:
    src: dns-hosts.json.j2
    dest: /etc/pihole/dns-hosts.json
    owner: root
    group: root
    mode: '0600'
  register: pihole_dns_hosts_json

- name: Read Pi-hole dns.hosts payload
  slurp:
    src: /etc/pihole/dns-hosts.json
  register: pihole_dns_hosts_payload

- name: Apply Pi-hole local DNS records through FTL config
  command:
    argv:
      - pihole-FTL
      - --config
      - dns.hosts
      - "{{ pihole_dns_hosts_payload.content | b64decode | trim }}"
  when: pihole_dns_hosts_json.changed

- name: Remove legacy custom.list when present
  file:
    path: /etc/pihole/custom.list
    state: absent

- name: Ensure pihole-FTL service is enabled and restarted
  systemd:
    name: pihole-FTL
    enabled: true
    state: restarted
